// ---- More scenery: one landmark scene per place (same horizon convention as above) ----
const G = HORIZON_Y;
function P(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
  ctx.fill();
}
function R(color, x, y, w, h) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
function C(color, x, y, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function E(color, x, y, rx, ry, a0 = 0, a1 = Math.PI * 2) { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, a0, a1); ctx.fill(); }
function skyTint(color) { R(color, 0, -SCENERY_SHIFT, W, G + SCENERY_SHIFT); }
function groundTint(color) { R(color, 0, G, W, H); }
function sea(color = 'rgba(60,140,210,0.8)', depth = 14) { R(color, 0, G - depth, W, depth); }
function hills(color, base, amp, seed) {
  const pts = [];
  for (let x = 0; x <= W; x += 60) pts.push([x, base - amp * (0.5 + 0.5 * Math.sin(x * 0.011 + seed) * Math.cos(x * 0.004 + seed * 2))]);
  drawHills(color, pts);
}
function backdrop(seed, back = 'rgba(90,120,140,0.45)', front = 'rgba(70,110,80,0.55)') {
  hills(back, 125, 60, seed);
  hills(front, 165, 30, seed + 1.7);
}
function peak(x, w, h, color, snow) {
  P(color, [[x - w, G], [x, G - h], [x + w, G]]);
  if (snow) P(snow, [[x - w * 0.28, G - h * 0.72], [x, G - h], [x + w * 0.28, G - h * 0.72], [x + w * 0.1, G - h * 0.64], [x - w * 0.1, G - h * 0.68]]);
}
function palm(x, h = 70) {
  ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, G); ctx.quadraticCurveTo(x + 12, G - h / 2, x + 4, G - h); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.fillStyle = '#3f9a3a';
  for (let a = 0; a < 6; a++) {
    ctx.save(); ctx.translate(x + 4, G - h); ctx.rotate(-Math.PI + a * Math.PI / 5);
    ctx.beginPath(); ctx.ellipse(18, 0, 20, 5, 0.25, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}
function pine(x, h = 50, snow) {
  R('#6a4a2a', x - 3, G - 10, 6, 10);
  for (let i = 0; i < 3; i++) {
    const y = G - 8 - i * h / 4, w = (3 - i) * h / 6, top = y - h / 2.5;
    P('#2f6a3a', [[x - w, y], [x, top], [x + w, y]]);
    if (snow) P('#fff', [[x - w * 0.35, top + h / 2.5 * 0.35], [x, top], [x + w * 0.35, top + h / 2.5 * 0.35]]);
  }
}
function acacia(x, s = 1) {
  ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 4 * s;
  ctx.beginPath(); ctx.moveTo(x, G); ctx.lineTo(x, G - 30 * s); ctx.lineTo(x - 14 * s, G - 44 * s);
  ctx.moveTo(x, G - 30 * s); ctx.lineTo(x + 16 * s, G - 44 * s); ctx.stroke(); ctx.lineWidth = 1;
  E('#4a7a2a', x, G - 48 * s, 42 * s, 9 * s);
}
function sunDisk(x, y, r, color = 'rgba(255,220,90,0.9)') { C(color, x, y, r); }
function stars(n, seed = 1) {
  for (let i = 0; i < n; i++) C('rgba(255,255,255,0.9)', (i * 197 + seed * 53) % W, ((i * 89 + seed * 31) % 200) - 30, (i % 3) * 0.6 + 0.8);
}

    R('rgba(170,220,255,0.7)', x + w * 0.5, y, 5, 120);
  }
}
function sceneParty() {
  backdrop(5);
  ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(150, 30); ctx.quadraticCurveTo(450, 90, 750, 30); ctx.stroke(); ctx.lineWidth = 1;
  const cols = ['#e0452b', '#ffae00', '#3aa0ff', '#36a426', '#b040e0'];
  for (let i = 0; i < 14; i++) {
    const t = i / 13, x = 150 + t * 600, y = 30 + Math.sin(t * Math.PI) * 45;
    P(cols[i % 5], [[x - 12, y], [x + 12, y], [x, y + 22]]);
  }
  ctx.save(); ctx.translate(450, 140); ctx.scale(3, 3);
  C('#fff', -11, -4, 5); C('#fff', -11, 4, 5); C('#fff', 11, -4, 5); C('#fff', 11, 4, 5); R('#fff', -11, -4, 22, 8);
  ctx.restore();
}
function sceneVolcano() {
  skyTint('rgba(160,40,20,0.45)');
  groundTint('rgba(60,30,20,0.4)');
  peak(460, 220, 170, 'rgba(60,40,40,0.9)');
  P('rgba(255,120,40,0.9)', [[440, G - 168], [460, G - 172], [480, G - 168], [470, G - 120], [450, G - 130]]);
  for (let i = 0; i < 8; i++) C('rgba(255,150,60,0.8)', 430 + (i * 23) % 60, G - 190 - (i * 17) % 60, 3 + i % 3);
}
function sceneStorm() {
  skyTint('rgba(40,45,60,0.7)');
  backdrop(3, 'rgba(60,70,90,0.6)', 'rgba(50,70,60,0.6)');
  ctx.strokeStyle = 'rgba(200,210,230,0.5)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 40; i++) { const x = (i * 97) % W, y = (i * 53) % 180 - 20; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 16); ctx.stroke(); }
  ctx.lineWidth = 1;
  P('rgba(255,240,150,0.85)', [[610, -30], [590, 30], [604, 30], [584, 90], [620, 20], [606, 20], [626, -30]]);
}

function sceneNight() {
  skyTint('rgba(20,20,60,0.65)');
  groundTint('rgba(30,20,50,0.35)');
  stars(40, 3);
  C('rgba(255,245,200,0.95)', 720, 30, 30);
  C('rgba(20,20,60,0.65)', 708, 22, 26);
  backdrop(4, 'rgba(40,40,80,0.6)', 'rgba(40,60,50,0.6)');
  for (const x of [180, 260, 520, 600]) {
    R('#8a8a9a', x - 10, G - 30, 20, 30); C('#8a8a9a', x, G - 30, 10);
    R('#5a5a6a', x - 5, G - 26, 10, 2); R('#5a5a6a', x - 1, G - 32, 2, 12);
  }
  for (const x of [340, 440]) {
    E('#f08a20', x, G - 10, 13, 10);
    P('#ffe25a', [[x - 7, G - 13], [x - 3, G - 13], [x - 5, G - 17]]);
    P('#ffe25a', [[x + 3, G - 13], [x + 7, G - 13], [x + 5, G - 17]]);
    R('#ffe25a', x - 6, G - 8, 12, 3);
    R('#3a8a2a', x - 1, G - 23, 3, 5);
  }
}

// 미래편: the same world under alien occupation.
function futureOverlay() {
  skyTint('rgba(70,20,110,0.32)');
  groundTint('rgba(90,40,120,0.18)');
  const x = 760, y = 20;
  E('#b8c0d0', x, y, 34, 9);
  E('rgba(120,255,200,0.8)', x, y - 6, 14, 10, Math.PI, 0);
  P('rgba(150,255,210,0.18)', [[x - 12, y + 6], [x + 12, y + 6], [x + 40, G], [x - 40, G]]);
}

const SCENES = {
  korea: drawKorea, china: drawChina, japan: drawJapan, newyork: drawUSA,
  mongolia: sceneMongolia, thailand: sceneThailand, cambodia: sceneCambodia, philippines: scenePhilippines,
  australia: sceneAustralia, singapore: sceneSingapore, maldives: sceneMaldives, india: sceneIndia, nepal: sceneNepal,
  dubai: sceneDubai, saudi: sceneSaudi, kenya: sceneKenya, madagascar: sceneMadagascar, southafrica: sceneSouthAfrica,
  ghana: sceneGhana, sahara: sceneSahara, egypt: sceneEgypt, turkey: sceneTurkey, russia: sceneRussia, greece: sceneGreece,
  italy: sceneItaly, monaco: sceneMonaco, spain: sceneSpain, france: sceneFrance, germany: sceneGermany,
  denmark: sceneDenmark, norway: sceneNorway, uk: sceneUK, greenland: sceneGreenland, canada: sceneCanada,
  bermuda: sceneBermuda, jamaica: sceneJamaica, colombia: sceneColombia, brazil: sceneBrazil, argentina: sceneArgentina,
  machupicchu: sceneMachuPicchu, easter: sceneEaster, mexico: sceneMexico, nasa: sceneNasa, vegas: sceneVegas,
  hollywood: sceneHollywood, alaska: sceneAlaska, hawaii: sceneHawaii, moon: sceneMoon, abyss: sceneAbyss,
  floating: sceneFloating, party: sceneParty, volcano: sceneVolcano, storm: sceneStorm, night: sceneNight,
};

function drawStageScenery(s) {
  SCENES[s.scene]();
  if (s.alien) futureOverlay();
}

// ---- Rendering ----
function drawBackground(c, w, h, yOffset) {
  const bg = IMAGES.background;
  if (ready(bg)) {
    c.drawImage(bg, 0, yOffset, w, 360);
  } else {
    c.fillStyle = '#8fd6ff'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#9ad84a'; c.fillRect(0, 227 + yOffset, w, h);
  }
}

function drawUnit(u) {
  const facing = DIR[u.side];
  let x = u.x;
  let y = LANE_Y + u.yOff;
  if (u.atkAnim > 0) x += facing * Math.sin(Math.PI * (1 - u.atkAnim / 0.25)) * 8;
  if (u.kbT > 0) y -= Math.sin(Math.PI * (1 - u.kbT / KB_TIME)) * 22;
  const drawSize = u.size * 1.45;
  y -= u.fly;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(u.x, LANE_Y + u.yOff, drawSize * 0.45, 4, 0, 0, Math.PI * 2); ctx.fill();
  if (u.alien) {
    const g = ctx.createRadialGradient(x, y - drawSize * 0.45, 2, x, y - drawSize * 0.45, drawSize * 0.75);
    g.addColorStop(0, 'rgba(190,90,255,0.55)');
    g.addColorStop(1, 'rgba(190,90,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y - drawSize * 0.45, drawSize * 0.75, 0, Math.PI * 2); ctx.fill();
  }
  const attacking = u.kbT <= 0 && u.state === 'attack' && u.atkTimer > u.atkCooldown - 0.6;
  drawCritter(ctx, x, y, drawSize, u.look, u.anim, facing, u.state === 'walk' && u.kbT <= 0, attacking);
  if (u.rarity && u.rarity !== 'N') outlinedText(ctx, RARITY_NAMES[u.rarity], x, y - drawSize * 1.1 - 6, 13, RARITY_COLORS[u.rarity]);
}

function drawEffect(e) {
  const p = 1 - e.t / e.max;
  ctx.save();
  if (e.type === 'spark') {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.globalAlpha = 1 - p;
    const r = 6 + p * 14;
    ctx.beginPath();
    for (let a = 0; a < 8; a++) {
      const ang = a * Math.PI / 4;
      ctx.moveTo(e.x + Math.cos(ang) * r * 0.4, e.y + Math.sin(ang) * r * 0.4);
      ctx.lineTo(e.x + Math.cos(ang) * r, e.y + Math.sin(ang) * r);
    }
    ctx.stroke();
    ctx.strokeStyle = '#ffe25a'; ctx.lineWidth = 1.5; ctx.stroke();
  } else if (e.type === 'shot') {
    ctx.globalAlpha = 1 - p;
    ctx.strokeStyle = '#ffe25a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2); ctx.stroke();
  } else if (e.type === 'soul') {
    const y = e.y - p * 60;
    ctx.globalAlpha = 1 - p;
    ctx.lineWidth = 2; ctx.strokeStyle = OUT; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(e.x, y, 8, Math.PI, 0); ctx.lineTo(e.x + 8, y + 10); ctx.lineTo(e.x + 3, y + 7); ctx.lineTo(e.x - 2, y + 10); ctx.lineTo(e.x - 8, y + 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(e.x, y - 12, 7, 2.5, 0, 0, Math.PI * 2); ctx.stroke();
  } else if (e.type === 'beam') {
    ctx.globalAlpha = 1 - p;
    const front = PLAYER_TOWER_X - Math.min(1, p * 3) * W;
    const grad = ctx.createLinearGradient(0, LANE_Y - 60, 0, LANE_Y);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, 'rgba(255,240,140,0.9)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(front, LANE_Y - 60, PLAYER_TOWER_X - front, 60);
  } else if (e.type === 'text') {
    ctx.globalAlpha = Math.min(1, e.t / 0.3);
    outlinedText(ctx, e.text, e.x, e.y - p * (e.rise || 0), e.px, e.color);
  }
  ctx.restore();
}

function draw() {
  drawBackground(ctx, W, H, 0);
  ctx.save();
  ctx.translate(0, SCENERY_SHIFT);
  drawStageScenery(stage);
  ctx.restore();

  drawCatBase(ctx, towers.enemy.x, LANE_Y + 8, towers.enemy.shake);
  drawDogBase(ctx, towers.player.x, LANE_Y + 8, towers.player.shake);
  outlinedText(ctx, `${Math.max(0, Math.ceil(towers.enemy.hp))}/${towers.enemy.maxHp}`, towers.enemy.x, LANE_Y + 8 - BASE_H - 8, 20, '#fff');
  outlinedText(ctx, `${Math.max(0, Math.ceil(towers.player.hp))}/${towers.player.maxHp}`, towers.player.x, LANE_Y + 8 - BASE_H - 8, 20, '#fff');

  for (const unit of [...units].sort((a, b) => a.yOff - b.yOff)) drawUnit(unit);
  for (const e of effects) drawEffect(e);

  // HUD
  $('money').textContent = `${Math.floor(money)}/${walletMax()}${CURRENCY}`;
  for (const { el, id, mask, num } of slotEls) {
    const def = UNIT_TYPES[id];
    const left = cooldowns[id] || 0;
    const cooling = left > 0;
    el.classList.toggle('cant', money < def.cost || gameOver);
    el.classList.toggle('cooling', cooling);
    if (cooling) {
      mask.style.height = (left / def.cd * 100) + '%';
      num.textContent = left >= 1 ? Math.ceil(left) : left.toFixed(1);
    }
  }
  const maxed = workerLv >= WORKER_MAX;
  $('workerLv').textContent = maxed ? 'MAX' : `레벨 ${workerLv}`;
  $('workerCost').textContent = maxed ? '' : `${workerCost()}${CURRENCY}`;
  $('workerBtn').disabled = maxed || money < workerCost() || gameOver;

  const cannonBtn = $('cannonBtn');
  const cannonReady = cannonCharge >= CANNON_MAX && !gameOver;
  cannonBtn.style.setProperty('--p', cannonCharge / CANNON_MAX * 100);
  cannonBtn.classList.toggle('ready', cannonReady);
  cannonBtn.disabled = !cannonReady;
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (stage) {
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}
showScreen('lobby');
requestAnimationFrame(loop);
</script>
